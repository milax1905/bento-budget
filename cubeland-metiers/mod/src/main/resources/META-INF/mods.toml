modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://cubeland.fr"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="IGNORE_SERVER_VERSION"
description='''
Les six metiers de Cubeland, panneau compris : mineur, bucheron, fermier,
chasseur, pecheur et cuisinier. C'est ce mod qui tient les metiers ; la boutique
ne garde que l'argent et la vente, et recoit l'experience pour ses bonus de prix.
La cuisine se joue en cinq paliers ; chaque plat a une famille, un effet,
une qualite tiree au sort et une valeur marchande.
Tout se regle dans config/cubeland-metiers/.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cubeboutique"
    mandatory=false
    versionRange="[3,)"
    ordering="AFTER"
    side="BOTH"
