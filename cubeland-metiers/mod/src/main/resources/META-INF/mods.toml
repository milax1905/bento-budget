modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://cubeland.fr"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Le serveur Cubeland et ses cuisiniers."
logoFile="logo.png"
displayURL="https://cubeland.fr"
displayTest="MATCH_VERSION"
description='''
Les six métiers de Cubeland, panneau compris : mineur, bûcheron, fermier,
chasseur, pêcheur et cuisinier. C'est ce mod qui tient les métiers ; la boutique
ne garde que l'argent et la vente, et reçoit l'expérience pour ses bonus de prix.

La cuisine se joue en cinq paliers, un poste par palier. Chaque plat a une
famille, un effet, une qualité tirée au sort et une valeur marchande. Le carnet
propose trois commandes en permanence et guide les premiers pas.

Le serveur lit seul config/cubeland-metiers/ et envoie ses réglages aux joueurs.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cubeboutique"
    mandatory=false
    versionRange="[3,)"
    ordering="AFTER"
    side="BOTH"
