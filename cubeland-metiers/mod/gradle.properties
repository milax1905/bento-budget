# Memoire pour gradle (la decompilation de Minecraft en demande pas mal).
# Les fichiers .properties sont lus en Latin-1 : les accents s'ecrivent \uXXXX.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environnement

# La version de Minecraft doit correspondre a la version de Forge.
minecraft_version=1.19.2
minecraft_version_range=[1.19.2,1.20)
forge_version=43.4.4
forge_version_range=[43,)
loader_version_range=[43,)
# Mappings officiels Mojang.
mapping_channel=official
mapping_version=1.19.2


